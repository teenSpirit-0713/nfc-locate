<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>BIKE · LOCATE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-raised: #1c1c1c;
    --hi-vis: #D4FF00;
    --hi-vis-dim: #7A9400;
    --text: #e0e0e0;
    --text-muted: #6b6b6b;
    --danger: #FF3B30;
    --border: #2a2a2a;
    --dash: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Noise texture overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Tire tread pattern ── */
  .tread-pattern {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--hi-vis) 0px,
      var(--hi-vis) 12px,
      transparent 12px,
      transparent 20px
    );
    opacity: 0.6;
    z-index: 100;
  }
  .tread-pattern.bottom {
    top: auto; bottom: 0;
  }

  /* ── App container ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: var(--hi-vis);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot {
    width: 6px; height: 6px;
    background: var(--hi-vis);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--hi-vis); }
    50% { opacity: 0.3; box-shadow: 0 0 2px var(--hi-vis); }
  }
  .status-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid var(--border);
  }
  .status-tag.active {
    color: var(--hi-vis);
    border-color: var(--hi-vis-dim);
  }

  /* ── Main content ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
    overflow: hidden;
  }

  /* ── Big timestamp ── */
  .time-block {
    padding: 32px 0 24px;
    border-bottom: 2px dashed var(--dash);
    margin-bottom: 20px;
  }
  .time-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .time-value {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .time-relative {
    font-size: 14px;
    font-weight: 500;
    color: var(--hi-vis);
    margin-top: 4px;
  }
  .time-empty {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-muted);
  }

  /* ── Map ── */
  .map-wrapper {
    flex: 1;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
    margin-bottom: 20px;
  }
  .map-wrapper.empty {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #map {
    width: 100%;
    height: 100%;
  }
  .leaflet-container {
    background: var(--surface);
    font-family: inherit;
  }
  /* Force dark map tiles — applied to container so new tiles inherit it */
  .leaflet-tile-pane {
    filter: brightness(0.35) saturate(0.25) hue-rotate(160deg) !important;
  }
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-attribution {
    display: none !important;
  }
  .leaflet-popup-content-wrapper {
    background: var(--surface-raised) !important;
    color: var(--text) !important;
    border-radius: 2px !important;
    border: 1px solid var(--hi-vis-dim) !important;
    font-family: 'Noto Sans SC', sans-serif !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
  }
  .leaflet-popup-tip {
    background: var(--surface-raised) !important;
  }

  .map-empty-state {
    text-align: center;
    color: var(--text-muted);
  }
  .map-empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .map-empty-text {
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  /* ── Road marking divider ── */
  .road-divider {
    height: 3px;
    background: repeating-linear-gradient(
      90deg,
      var(--text-muted) 0px,
      var(--text-muted) 24px,
      transparent 24px,
      transparent 32px
    );
    opacity: 0.3;
    margin-bottom: 20px;
  }

  /* ── Action buttons ── */
  .actions {
    padding: 0 24px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 16px 20px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.97); }

  .btn-park {
    background: var(--hi-vis);
    color: #0a0a0a;
  }
  .btn-park:active { background: #b8d900; }
  .btn-park:disabled {
    background: var(--surface);
    color: var(--text-muted);
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-find {
    background: transparent;
    color: var(--hi-vis);
    border: 2px solid var(--hi-vis);
  }
  .btn-find:active { background: rgba(212, 255, 0, 0.08); }
  .btn-find:disabled {
    border-color: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-full {
    grid-column: 1 / -1;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface-raised);
    color: var(--hi-vis);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 10px 20px;
    border: 1px solid var(--hi-vis-dim);
    border-radius: 2px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    color: var(--danger);
    border-color: var(--danger);
  }

  /* ── Loading spinner ── */
  .spinner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .spinner-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--hi-vis);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-text {
    margin-top: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
  }

  /* ── Location indicator stripes ── */
  .loc-stripes {
    display: flex;
    gap: 3px;
    margin-bottom: 16px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .loc-stripes.visible { opacity: 1; }
  .loc-stripe {
    flex: 1;
    height: 2px;
    background: var(--hi-vis);
    opacity: 0;
    animation: stripe-reveal 0.6s ease forwards;
  }
  .loc-stripe:nth-child(1) { animation-delay: 0.0s; }
  .loc-stripe:nth-child(2) { animation-delay: 0.08s; }
  .loc-stripe:nth-child(3) { animation-delay: 0.16s; }
  .loc-stripe:nth-child(4) { animation-delay: 0.24s; }
  .loc-stripe:nth-child(5) { animation-delay: 0.32s; }

  @keyframes stripe-reveal {
    0% { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  /* ── Accuracy indicator ── */
  .accuracy-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .accuracy-bar.visible { opacity: 1; }
  .accuracy-dots {
    display: flex;
    gap: 3px;
  }
  .accuracy-dot {
    width: 16px; height: 3px;
    background: var(--border);
    border-radius: 1px;
    transition: background 0.3s ease;
  }
  .accuracy-dot.on { background: var(--hi-vis); }
  .accuracy-dot.on.dim { background: var(--hi-vis-dim); }

  /* ── Compass overlay ── */
  .compass-overlay {
    position: absolute;
    inset: 0;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 10;
    padding: 20px;
  }
  .compass-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .compass-ring {
    position: relative;
    width: 200px; height: 200px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(212,255,0,0.03) 0%, transparent 70%);
  }
  .compass-ring::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1px dashed var(--dash);
    border-radius: 50%;
    opacity: 0.5;
  }
  /* Tick marks */
  .compass-tick {
    position: absolute;
    width: 2px; height: 8px;
    background: var(--border);
    transform-origin: center 100px;
  }
  .compass-tick.cardinal {
    width: 2px; height: 14px;
    background: var(--text-muted);
  }
  .compass-tick.north {
    background: var(--hi-vis);
    height: 16px;
  }
  .compass-label {
    position: absolute;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  .compass-arrow {
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 60px solid var(--hi-vis);
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 16px rgba(212,255,0,0.4));
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .compass-arrow::after {
    content: '';
    position: absolute;
    top: 60px; left: -12px;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid var(--hi-vis);
    opacity: 0.3;
  }
  .compass-dot {
    width: 8px; height: 8px;
    background: var(--hi-vis);
    border-radius: 50%;
    position: absolute;
    z-index: 3;
    box-shadow: 0 0 12px rgba(212,255,0,0.6);
  }

  .compass-distance {
    margin-top: 28px;
    text-align: center;
  }
  .compass-dist-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 56px;
    font-weight: 400;
    color: var(--hi-vis);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .compass-dist-unit {
    font-size: 20px;
    color: var(--hi-vis-dim);
  }
  .compass-dist-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
  }

  .compass-signal {
    display: flex;
    gap: 2px;
    margin-top: 16px;
    align-items: flex-end;
    height: 20px;
  }
  .compass-signal-bar {
    width: 3px;
    background: var(--hi-vis-dim);
    border-radius: 1px;
    transition: height 0.3s ease;
  }


  /* ── User location pulse (on map) ── */
  .user-marker {
    width: 16px; height: 16px;
    background: #4DA6FF;
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 6px rgba(77,166,255,0.25), 0 0 0 14px rgba(77,166,255,0.1);
    animation: user-pulse 2s ease-out infinite;
  }
  @keyframes user-pulse {
    0% { box-shadow: 0 0 0 6px rgba(77,166,255,0.25), 0 0 0 14px rgba(77,166,255,0.1); }
    100% { box-shadow: 0 0 0 12px rgba(77,166,255,0.05), 0 0 0 28px rgba(77,166,255,0); }
  }

  /* ── Responsive ── */
  @media (min-width: 540px) {
    .app { max-width: 480px; margin: 0 auto; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .app {
      height: 100vh;
      max-height: 900px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div class="tread-pattern"></div>
<div class="tread-pattern bottom"></div>

<div class="app">
  <header class="header">
    <div class="logo">
      <span class="logo-dot"></span>
      BIKE · LOCATE
    </div>
    <div class="status-tag" id="statusTag">等待定位</div>
  </header>

  <div class="main">
    <div class="time-block">
      <div class="time-label">上次停车位置</div>
      <div class="time-value" id="timeFull">--</div>
      <div class="time-relative" id="timeRelative"></div>
      <div class="time-empty" id="timeEmpty"></div>
    </div>

    <div class="loc-stripes" id="locStripes">
      <div class="loc-stripe"></div>
      <div class="loc-stripe"></div>
      <div class="loc-stripe"></div>
      <div class="loc-stripe"></div>
      <div class="loc-stripe"></div>
    </div>

    <div class="accuracy-bar" id="accuracyBar">
      <span>精度</span>
      <div class="accuracy-dots">
        <div class="accuracy-dot"></div>
        <div class="accuracy-dot"></div>
        <div class="accuracy-dot"></div>
        <div class="accuracy-dot"></div>
        <div class="accuracy-dot"></div>
      </div>
      <span id="accuracyText">--</span>
    </div>

    <div class="map-wrapper" id="mapWrapper">
      <div id="map"></div>
      <div class="compass-overlay" id="compassOverlay">
        <div class="compass-ring" id="compassRing">
          <div class="compass-arrow" id="compassArrow"></div>
          <div class="compass-dot"></div>
        </div>
        <div class="compass-distance">
          <div class="compass-dist-value">
            <span id="compassDist">0</span>
            <span class="compass-dist-unit">m</span>
          </div>
          <div class="compass-dist-label" id="compassLabel">距离单车</div>
        </div>
        <div class="compass-signal" id="compassSignal"></div>
      </div>
      <div class="map-empty-state" id="mapEmpty">
        <div class="map-empty-icon">&#9873;</div>
        <div class="map-empty-text">尚未记录停车位置</div>
      </div>
    </div>
  </div>

  <div class="road-divider"></div>

  <div class="actions">
    <button class="btn btn-park" id="btnPark" onclick="parkBike()">
      停车记录
    </button>
    <button class="btn btn-find" id="btnFind" onclick="findBike()" disabled>
      找车导航
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="spinner-overlay" id="spinner">
  <div class="spinner"></div>
  <div class="spinner-text">获取位置中</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── State ──
let map = null;
let bikeMarker = null;
let userMarker = null;
let userPosition = null;       // { lat, lng, accuracy, heading }
let savedLocation = null;      // { lat, lng, accuracy, timestamp }
let deviceHeading = null;      // from deviceorientation
let watchId = null;
let compassActive = false;
let gpsReadings = 0;
let boundsAdjusted = false;    // track whether we've fit both markers on screen

const COMPASS_THRESHOLD = 50;  // meters
const $ = (s) => document.getElementById(s);

// ── Math helpers ──
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function bearing(lat1, lng1, lat2, lng2) {
  const dLng = toRad(lng2 - lng1);
  const y = Math.sin(dLng) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// ── Init map ──
function initMap() {
  if (map) return;
  map = L.map('map', {
    zoomControl: true,
    attributionControl: false,
    dragging: true,
    touchZoom: true,
  }).setView([31.2304, 121.4737], 14);

  // Dark tiles first, fall back to OSM
  const tileServers = [
    { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', label: 'CartoDB-Dark' },
    { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', label: 'OSM' },
    { url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png', label: 'OSM-DE' },
  ];

  let tileIdx = 0;
  let tileLayer = null;

  function tryTile() {
    if (tileIdx >= tileServers.length) return;
    const srv = tileServers[tileIdx];
    if (tileLayer) map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(srv.url, { maxZoom: 19 }).addTo(map);
    const t = setTimeout(() => { tileIdx++; tryTile(); }, 5000);
    tileLayer.once('load', () => clearTimeout(t));
  }
  tryTile();
}

// ── Load saved bike location ──
function loadSaved() {
  const raw = localStorage.getItem('bike_location');
  if (raw) {
    try { savedLocation = JSON.parse(raw); return true; }
    catch (e) { localStorage.removeItem('bike_location'); }
  }
  return false;
}

// ── Format time ──
function formatTime(ts) {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  if (h < 24) return `${h} 小时前`;
  return `${d} 天前`;
}

// ── Update accuracy bar ──
function updateAccuracy(accuracyMeters) {
  const bar = $('accuracyBar');
  const text = $('accuracyText');
  const dots = bar.querySelectorAll('.accuracy-dot');
  let lvl;
  if (accuracyMeters <= 5) lvl = 5;
  else if (accuracyMeters <= 10) lvl = 4;
  else if (accuracyMeters <= 20) lvl = 3;
  else if (accuracyMeters <= 50) lvl = 2;
  else lvl = 1;
  dots.forEach((dot, i) => {
    dot.className = 'accuracy-dot';
    if (i < lvl) { dot.classList.add('on'); if (lvl <= 2) dot.classList.add('dim'); }
  });
  text.textContent = `±${Math.round(accuracyMeters)}m`;
  bar.classList.add('visible');
}

// ── Update signal bars in compass mode ──
function updateSignalBars(accuracyMeters) {
  const container = $('compassSignal');
  let lvl;
  if (accuracyMeters <= 5) lvl = 5;
  else if (accuracyMeters <= 10) lvl = 4;
  else if (accuracyMeters <= 20) lvl = 3;
  else if (accuracyMeters <= 50) lvl = 2;
  else lvl = 1;
  let html = '';
  for (let i = 0; i < 5; i++) {
    const h = (i + 1) * 4;
    const bg = i < lvl ? 'var(--hi-vis)' : 'var(--border)';
    html += `<div class="compass-signal-bar" style="height:${h}px;background:${bg}"></div>`;
  }
  container.innerHTML = html;
}

// ── Render UI ──
function render() {
  loadSaved();
  if (savedLocation) {
    $('timeFull').textContent = formatTime(savedLocation.timestamp);
    $('timeRelative').textContent = relativeTime(savedLocation.timestamp);
    $('timeEmpty').textContent = '';
    $('btnFind').disabled = false;
  } else {
    $('timeFull').textContent = '--';
    $('timeRelative').textContent = '';
    $('timeEmpty').textContent = '等待首次停车记录';
    $('btnFind').disabled = true;
  }
}

// ── Toast ──
let toastTimer;
function showToast(msg, isError = false, duration = 2500) {
  const t = $('toast');
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.className = 'toast ' + (isError ? 'error' : '');
  requestAnimationFrame(() => t.classList.add('show'));
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ── Spinner ──
function showSpinner(text = '获取位置中') {
  $('spinner').querySelector('.spinner-text').textContent = text;
  $('spinner').classList.add('active');
}
function hideSpinner() {
  $('spinner').classList.remove('active');
}

// ── Bike marker icon (with built-in label, no floating popup) ──
function createBikeIcon() {
  return L.divIcon({
    className: '',
    html: `<div style="display:flex;flex-direction:column;align-items:center;transform:translateY(-20px)">
      <div style="width:28px;height:28px;background:#D4FF00;border:3px solid #0a0a0a;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 20px rgba(212,255,0,0.5),0 2px 8px rgba(0,0,0,0.6)"></div>
      <div style="margin-top:6px;font-size:11px;font-weight:700;color:#D4FF00;letter-spacing:0.06em;text-shadow:0 0 8px rgba(212,255,0,0.4);white-space:nowrap">我的单车</div>
    </div>`,
    iconSize: [80, 60],
    iconAnchor: [40, 42],
  });
}

function createUserIcon() {
  return L.divIcon({
    className: '',
    html: '<div class="user-marker"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  });
}

// ── Place bike marker ──
function placeBikeMarker(lat, lng) {
  if (!map) initMap();
  if (bikeMarker) map.removeLayer(bikeMarker);
  bikeMarker = L.marker([lat, lng], { icon: createBikeIcon() }).addTo(map);
  $('map').style.display = 'block';
  $('mapWrapper').classList.remove('empty');
  $('mapEmpty').style.display = 'none';
}

// ── Update user marker position ──
function updateUserMarker(lat, lng) {
  if (!map) initMap();
  if (!userMarker) {
    userMarker = L.marker([lat, lng], { icon: createUserIcon() }).addTo(map);
  } else {
    userMarker.setLatLng([lat, lng]);
  }
  $('map').style.display = 'block';
  $('mapWrapper').classList.remove('empty');
  $('mapEmpty').style.display = 'none';
}

// ── Fit map bounds to show both user and bike ──
function fitBothMarkers() {
  if (!map || !userPosition || !savedLocation) return;
  if (!userMarker || !bikeMarker) return;
  const dist = haversineDistance(userPosition.lat, userPosition.lng, savedLocation.lat, savedLocation.lng);
  if (dist <= COMPASS_THRESHOLD) return; // compass mode handles this
  const bounds = L.latLngBounds(
    [userPosition.lat, userPosition.lng],
    [savedLocation.lat, savedLocation.lng]
  );
  map.fitBounds(bounds, { padding: [50, 50], maxZoom: 17, animate: true });
  boundsAdjusted = true;
}

// ── Compass mode ──
function updateCompass() {
  if (!userPosition || !savedLocation) return;

  const dist = haversineDistance(userPosition.lat, userPosition.lng, savedLocation.lat, savedLocation.lng);
  const brg = bearing(userPosition.lat, userPosition.lng, savedLocation.lat, savedLocation.lng);

  // Arrow rotation: bearing adjusted by device heading
  let arrowDeg = brg;
  if (deviceHeading !== null) {
    arrowDeg = brg - deviceHeading;
  }

  $('compassArrow').style.transform = `rotate(${arrowDeg}deg)`;
  $('compassDist').textContent = Math.round(dist);

  if (dist <= 3) $('compassLabel').textContent = '就在附近';
  else if (dist <= 10) $('compassLabel').textContent = '非常接近';
  else if (dist <= 30) $('compassLabel').textContent = '正在靠近';
  else $('compassLabel').textContent = '距离单车';

  updateSignalBars(userPosition.accuracy);

  // Pure distance-based auto toggle, needs 3+ stable GPS readings
  const gpsStable = gpsReadings >= 3;
  const shouldCompass = gpsStable && dist <= COMPASS_THRESHOLD;

  if (shouldCompass && !compassActive) {
    compassActive = true;
    $('compassOverlay').classList.add('active');
  } else if (!shouldCompass && compassActive) {
    compassActive = false;
    $('compassOverlay').classList.remove('active');
  }

  // Fit bounds when in map mode (both markers visible)
  if (!shouldCompass && gpsStable && !boundsAdjusted) {
    fitBothMarkers();
  }
  if (!shouldCompass) {
    boundsAdjusted = false; // keep re-adjusting as positions change
  }
}

// ── Device orientation ──
function onDeviceOrientation(e) {
  // webkitCompassHeading for iOS, alpha for Android
  if (e.webkitCompassHeading !== undefined) {
    deviceHeading = e.webkitCompassHeading;
  } else if (e.alpha !== null) {
    // alpha is 0-360, but 0 = north on Android when absolute is true
    deviceHeading = e.alpha;
  }
}
window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
window.addEventListener('deviceorientation', onDeviceOrientation, true);

// ── Request device orientation permission (iOS 13+) ──
async function requestCompassPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm === 'granted') {
        window.addEventListener('deviceorientation', onDeviceOrientation);
      }
    } catch (e) {
      // Silently fail — compass arrow will just use bearing
    }
  }
}

// ── Real-time position tracking ──
function startWatchingPosition() {
  if (!navigator.geolocation) return;

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      gpsReadings++;
      userPosition = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        heading: pos.coords.heading,
      };

      updateUserMarker(userPosition.lat, userPosition.lng);
      updateAccuracy(userPosition.accuracy);
      $('locStripes').classList.add('visible');
      $('statusTag').textContent = '定位中';
      $('statusTag').classList.add('active');

      if (savedLocation) {
        updateCompass();
      }
    },
    (err) => {
      const msgs = { 1: '定位权限被拒绝', 2: '无法获取位置', 3: '定位超时' };
      $('statusTag').textContent = msgs[err.code] || '定位失败';
      $('statusTag').classList.remove('active');
    },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 }
  );
}

// ── PARK ──
async function parkBike() {
  const btn = $('btnPark');
  btn.disabled = true;

  // If we already have a fresh position from watchPosition, use it
  if (userPosition) {
    savedLocation = {
      lat: userPosition.lat,
      lng: userPosition.lng,
      accuracy: userPosition.accuracy,
      timestamp: Date.now(),
    };
    localStorage.setItem('bike_location', JSON.stringify(savedLocation));
    placeBikeMarker(savedLocation.lat, savedLocation.lng);
    updateAccuracy(userPosition.accuracy);
    $('statusTag').textContent = '已记录';
    $('statusTag').classList.add('active');
    render();
    showToast('停车位置已记录');
    btn.disabled = false;
    return;
  }

  // Fallback: single position request
  showSpinner('正在记录停车位置');
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true, timeout: 15000, maximumAge: 0,
      });
    });
    savedLocation = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      timestamp: Date.now(),
    };
    localStorage.setItem('bike_location', JSON.stringify(savedLocation));
    updateAccuracy(pos.coords.accuracy);
    $('statusTag').textContent = '已记录';
    $('statusTag').classList.add('active');
    placeBikeMarker(savedLocation.lat, savedLocation.lng);
    render();
    showToast('停车位置已记录');
  } catch (err) {
    const msgs = { 1: '定位权限被拒绝，请在设置中允许', 2: '暂时无法获取位置信息', 3: '定位超时，请重试' };
    showToast(msgs[err.code] || '定位失败', true);
  } finally {
    hideSpinner();
    btn.disabled = false;
  }
}

// ── FIND ──
function findBike() {
  if (!savedLocation) { showToast('没有停车记录', true); return; }
  const { lat, lng } = savedLocation;
  const label = encodeURIComponent('我的单车');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let url = isIOS
    ? `maps://maps.apple.com/?q=${label}&ll=${lat},${lng}`
    : `geo:${lat},${lng}?q=${lat},${lng}(${label})`;
  const fallback = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  const start = Date.now();
  window.location.href = url;
  setTimeout(() => {
    if (Date.now() - start < 2000) return;
    window.open(fallback, '_blank');
  }, 1500);
}

// ── Tick timers ──
function tickTime() {
  if (savedLocation) $('timeRelative').textContent = relativeTime(savedLocation.timestamp);
}

// ── Auto-park on NFC tap (URL hash #auto) ──
function autoParkIfNeeded() {
  if (window.location.hash === '#auto') {
    history.replaceState(null, '', window.location.pathname);
    // Wait for watchPosition to get a fix, then park
    const check = setInterval(() => {
      if (userPosition) {
        clearInterval(check);
        parkBike();
      }
    }, 500);
    // Timeout after 15s
    setTimeout(() => clearInterval(check), 15000);
  }
}

// ── Bootstrap ──
function bootstrap() {
  initMap();
  const hasSaved = loadSaved();

  if (hasSaved && savedLocation) {
    placeBikeMarker(savedLocation.lat, savedLocation.lng);
    updateAccuracy(savedLocation.accuracy || 20);
    $('statusTag').textContent = '已记录';
    $('statusTag').classList.add('active');
  } else {
    $('map').style.display = 'none';
    $('mapWrapper').classList.add('empty');
    $('mapEmpty').style.display = 'flex';
  }
  $('locStripes').classList.add('visible');
  render();
  startWatchingPosition();
  requestCompassPermission();
  autoParkIfNeeded();
}

document.addEventListener('DOMContentLoaded', bootstrap);
setInterval(tickTime, 30000);
</script>

</body>
</html>
